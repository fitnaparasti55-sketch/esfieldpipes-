<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="30%" stop-color="#18181b" />
      <stop offset="70%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <linearGradient id="innerBore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#f1f5f9" rx="16"/>

  <!-- Grid Pattern -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="1"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.6"/>

  <!-- Pipe Body -->
  <g filter="url(#shadow)">
    <!-- Base Body -->
    <rect x="80" y="120" width="480" height="160" rx="8" fill="url(#pipeGrad)"/>

    <!-- Corrugation Ribs -->
    <rect x='100' y='110' width='16' height='180' rx='4' fill='#27272a' stroke='#3f3f46' stroke-width='2'/><rect x='116' y='125' width='16' height='150' fill='#18181b' /><rect x='132' y='110' width='16' height='180' rx='4' fill='#27272a' stroke='#3f3f46' stroke-width='2'/><rect x='148' y='125' width='16' height='150' fill='#18181b' /><rect x='164' y='110' width='16' height='180' rx='4' fill='#27272a' stroke='#3f3f46' stroke-width='2'/><rect x='180' y='125' width='16' height='150' fill='#18181b' /><rect x='196' y='110' width='16' height='180' rx='4' fill='#27272a' stroke='#3f3f46' stroke-width='2'/><rect x='212' y='125' width='16' height='150' fill='#18181b' /><rect x='228' y='110' width='16' height='180' rx='4' fill='#27272a' stroke='#3f3f46' stroke-width='2'/><rect x='244' y='125' width='16' height='150' fill='#18181b' /><rect x='260' y='110' width='16' height='180' rx='4' fill='#27272a' stroke='#3f3f46' stroke-width='2'/><rect x='276' y='125' width='16' height='150' fill='#18181b' /><rect x='292' y='110' width='16' height='180' rx='4' fill='#27272a' stroke='#3f3f46' stroke-width='2'/><rect x='308' y='125' width='16' height='150' fill='#18181b' /><rect x='324' y='110' width='16' height='180' rx='4' fill='#27272a' stroke='#3f3f46' stroke-width='2'/><rect x='340' y='125' width='16' height='150' fill='#18181b' /><rect x='356' y='110' width='16' height='180' rx='4' fill='#27272a' stroke='#3f3f46' stroke-width='2'/><rect x='372' y='125' width='16' height='150' fill='#18181b' /><rect x='388' y='110' width='16' height='180' rx='4' fill='#27272a' stroke='#3f3f46' stroke-width='2'/><rect x='404' y='125' width='16' height='150' fill='#18181b' /><rect x='420' y='110' width='16' height='180' rx='4' fill='#27272a' stroke='#3f3f46' stroke-width='2'/><rect x='436' y='125' width='16' height='150' fill='#18181b' /><rect x='452' y='110' width='16' height='180' rx='4' fill='#27272a' stroke='#3f3f46' stroke-width='2'/><rect x='468' y='125' width='16' height='150' fill='#18181b' /><rect x='484' y='110' width='16' height='180' rx='4' fill='#27272a' stroke='#3f3f46' stroke-width='2'/><rect x='500' y='125' width='16' height='150' fill='#18181b' /><rect x='516' y='110' width='16' height='180' rx='4' fill='#27272a' stroke='#3f3f46' stroke-width='2'/><rect x='532' y='125' width='16' height='150' fill='#18181b' />

    <!-- Socket Joint End -->
    <path d="M 80 100 L 105 100 L 105 300 L 80 300 Z" fill="#3f3f46" stroke="#52525b" stroke-width="2"/>
    <ellipse cx="80" cy="200" rx="20" ry="100" fill="#18181b" stroke="#71717a" stroke-width="3"/>
    
    <!-- Smooth Inner Bore View -->
    <ellipse cx="80" cy="200" rx="14" ry="75" fill="url(#innerBore)"/>
    <circle cx="80" cy="200" r="10" fill="#09090b" opacity="0.8"/>

    <!-- Spigot End -->
    <ellipse cx="560" cy="200" rx="18" ry="80" fill="#27272a" stroke="#52525b" stroke-width="2"/>
  </g>

  <!-- Technical Spec Callout Badges -->
  <g transform="translate(40, 30)">
    <rect width="140" height="32" rx="16" fill="#0f172a"/>
    <text x="70" y="21" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">IS 16098-2 / SN8</text>
  </g>

  <g transform="translate(460, 30)">
    <rect width="140" height="32" rx="16" fill="#ea580c"/>
    <text x="70" y="21" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">PE-100 VIRGIN</text>
  </g>

  <!-- Dimension Indicator -->
  <g transform="translate(80, 330)">
    <line x1="0" y1="10" x2="480" y2="10" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="180" y="-2" width="120" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="240" y="15" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">ID: 200mm | OD: 235mm</text>
  </g>

  <text x="320" y="380" fill="#334155" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">200mm ID / 235mm OD Sewer Pipe</text>
</svg>